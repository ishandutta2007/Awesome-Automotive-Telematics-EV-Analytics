<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="orbGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40" result="blur"/>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.6"/>
      <circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity="0.3"/>
    </pattern>

    <style>
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-size: 46px;
        font-weight: 800;
        fill: #f8fafc;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-size: 20px;
        font-weight: 400;
        fill: #94a3b8;
      }
      .pill-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-size: 13px;
        font-weight: 600;
        fill: #e2e8f0;
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes pulseBeam {
        0% { stroke-dashoffset: 400; opacity: 0.2; }
        50% { opacity: 0.8; }
        100% { stroke-dashoffset: 0; opacity: 0.2; }
      }
      @keyframes rotateRadar {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      .floating-pill {
        animation: floatSlow 4s ease-in-out infinite;
      }
      .signal-line {
        stroke-dasharray: 80, 120;
        animation: pulseBeam 5s linear infinite;
      }
      .radar-sweep {
        transform-origin: 1040px 120px;
        animation: rotateRadar 8s linear infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bgGrad)"/>
  <rect width="1200" height="420" fill="url(#grid)"/>

  <!-- Ambient Glowing Orbs in Background -->
  <circle cx="150" cy="100" r="120" fill="#38bdf8" fill-opacity="0.12" filter="url(#orbGlow)"/>
  <circle cx="1050" cy="280" r="140" fill="#10b981" fill-opacity="0.1" filter="url(#orbGlow)"/>
  <circle cx="600" cy="380" r="160" fill="#6366f1" fill-opacity="0.1" filter="url(#orbGlow)"/>

  <!-- Dynamic Telematics Signal Network Path (Background) -->
  <g opacity="0.6">
    <path d="M 50 350 Q 300 280, 500 340 T 950 260 T 1150 320" fill="none" stroke="#1e293b" stroke-width="2"/>
    <path class="signal-line" d="M 50 350 Q 300 280, 500 340 T 950 260 T 1150 320" fill="none" stroke="url(#accentGrad)" stroke-width="3" filter="url(#glow)"/>
  </g>

  <!-- Futuristic Radar Widget Top-Right -->
  <g opacity="0.45">
    <circle cx="1040" cy="120" r="60" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4,4"/>
    <circle cx="1040" cy="120" r="40" fill="none" stroke="#1e293b" stroke-width="1"/>
    <circle cx="1040" cy="120" r="20" fill="none" stroke="#6366f1" stroke-width="1"/>
    <line x1="970" y1="120" x2="1110" y2="120" stroke="#334155" stroke-width="1"/>
    <line x1="1040" y1="50" x2="1040" y2="190" stroke="#334155" stroke-width="1"/>
    <g class="radar-sweep">
      <path d="M 1040 120 L 1100 120 A 60 60 0 0 0 1082 78 Z" fill="url(#pulseGrad)" opacity="0.3"/>
    </g>
  </g>

  <!-- Feature Tags / Metric Pills (Underneath Title) -->
  <g class="floating-pill" transform="translate(80, 240)">
    <!-- Pill 1: CAN Bus & OBD-II -->
    <g transform="translate(0, 0)">
      <rect width="180" height="34" rx="17" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6"/>
      <circle cx="20" cy="17" r="5" fill="#38bdf8"/>
      <text x="36" y="22" class="pill-text">CAN Bus &amp; OBD-II</text>
    </g>
    <!-- Pill 2: EV Battery Analytics -->
    <g transform="translate(195, 0)">
      <rect width="185" height="34" rx="17" fill="#0f172a" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.6"/>
      <circle cx="20" cy="17" r="5" fill="#10b981"/>
      <text x="36" y="22" class="pill-text">EV Battery Telemetry</text>
    </g>
    <!-- Pill 3: GPS Fleet Management -->
    <g transform="translate(395, 0)">
      <rect width="195" height="34" rx="17" fill="#0f172a" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.6"/>
      <circle cx="20" cy="17" r="5" fill="#818cf8"/>
      <text x="36" y="22" class="pill-text">Live Fleet Operations</text>
    </g>
    <!-- Pill 4: Open Source & Self-Host -->
    <g transform="translate(605, 0)">
      <rect width="180" height="34" rx="17" fill="#0f172a" stroke="#f59e0b" stroke-width="1.2" stroke-opacity="0.6"/>
      <circle cx="20" cy="17" r="5" fill="#f59e0b"/>
      <text x="36" y="22" class="pill-text">100% Open Source</text>
    </g>
  </g>

  <!-- Foreground Title and Branding Header -->
  <g transform="translate(80, 95)">
    <!-- Accent Line -->
    <rect x="0" y="0" width="60" height="4" rx="2" fill="url(#accentGrad)" filter="url(#glow)"/>

    <!-- Main Title -->
    <text x="0" y="55" class="title-text">
      Awesome Automotive Telematics
    </text>
    <text x="0" y="105" class="title-text" fill="url(#accentGrad)">
      &amp; EV Analytics ⚡🚗
    </text>

    <!-- Subtitle / Mission Statement -->
    <text x="0" y="140" class="subtitle-text">
      Curated open-source telematics platforms, EV fleet intelligence, OBD-II/CAN reverse-engineering &amp; self-hosted stacks.
    </text>
  </g>

  <!-- Bottom Visual Accent Border -->
  <rect x="0" y="416" width="1200" height="4" fill="url(#accentGrad)"/>
</svg>
